[project]
name = "rhmoo"
version = "0.1.0"
description = "Reward hacking in molecular multi-objective optimization"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rdkit>=2024.3",
    "admet-ai>=2.0.1",
    "selfies>=2.1.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

# PyTDC is deliberately NOT a dependency here: it pins rdkit<2024.3.1, which is
# incompatible with admet-ai 2.x (rdkit>=2025.9.5). TDC data is exported once by
# scripts/export_tdc_reference.py in an isolated pinned environment and cached.

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhmoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: fast subset that must complete in under a minute"]
